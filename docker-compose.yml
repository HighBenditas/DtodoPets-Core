services:
  postgres:
    image: postgres:18
    container_name: dtodopets-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - dtodopets-network


  redis:
    image: redis:8-alpine
    container_name: dtodopets-redis
    restart: unless-stopped

    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - dtodopets-network


volumes:
  postgres_data:
  redis_data:


networks:
  dtodopets-network:
    driver: bridge